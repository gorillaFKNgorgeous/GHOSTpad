name: Secret scan
# GHOSTpad is one public repository. Every push and pull request is scanned for
# capability URLs, tokens, provider credentials, device/agent/OAuth secrets,
# public IP addresses and IP-embedding relay hostnames. No path filter, so a
# change cannot skip the scan by touching an unlisted directory.
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Scanner self-test
        run: python -m unittest discover -s .github/scripts -p 'test_*.py' -v
      - name: Scan tracked files
        run: python .github/scripts/scan_secrets.py
